
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P360 - Convenção de Vendas KFG</title>
    <!-- Canvas-confetti para os fogos de artifício -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Playfair+Display:ital,wght@1,700&family=Roboto:wght@400;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Roboto', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1vh 2vw;
        }

        .header {
            text-align: center;
            flex-shrink: 0;
            margin-bottom: 1vh;
        }

        .logo {
            height: 12vh;
            width: auto;
            margin-bottom: 0.5vh;
        }

        .slogan-container {
            line-height: 0.9;
        }

        .slogan-sim-nos { font-family: 'Playfair Display', serif; font-style: italic; font-size: 2.8vh; color: #fff; display: block; }
        .slogan-podemos { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 10vh; font-weight: 900; color: #fff; display: block; }
        .slogan-vender { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 10.5vh; color: #fff; display: block; margin-top: -1vh; }
        .slogan-mais { font-family: 'Playfair Display', serif; font-size: 11vh; color: #fff; display: block; margin-top: -2vh; }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2vh;
            width: 100%;
            max-width: 95vw;
            flex-grow: 1;
            margin: 1vh 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2vh;
            position: relative;
        }

        .card-full { grid-column: span 2; }

        .label { text-transform: uppercase; font-size: 1.8vh; color: #aaa; letter-spacing: 1px; margin-bottom: 0.5vh; }

        .value {
            font-family: 'Oswald', sans-serif;
            font-size: 10vh;
            line-height: 1;
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .value-secondary {
            font-family: 'Oswald', sans-serif;
            font-size: 7vh;
            line-height: 1;
            color: #00ff88;
        }

        .progress-container {
            width: 80%;
            background-color: #333;
            border-radius: 20px;
            height: 3.5vh;
            margin-top: 1.5vh;
            overflow: hidden;
            border: 1px solid #444;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff8c00, #ffd700);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15px;
            transition: width 2s ease-in-out;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.5);
        }

        .progress-text { color: #000; font-weight: bold; font-size: 1.8vh; }

        .footer { flex-shrink: 0; text-align: center; padding: 1vh; color: #444; font-size: 1.2vh; text-transform: uppercase; }

        /* Efeito de brilho quando atingir 100% */
        .goal-reached {
            animation: pulse-gold 2s infinite;
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 10px #ffd700; }
            50% { box-shadow: 0 0 40px #ffd700; }
            100% { box-shadow: 0 0 10px #ffd700; }
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://raw.githubusercontent.com/fsbarbosa90/kfg-p360/refs/heads/main/02.png" alt="Logo KFG" class="logo">
        <div class="slogan-container">
            <span class="slogan-sim-nos">Sim, Nós</span>
            <span class="slogan-podemos">PODEMOS</span>
            <span class="slogan-vender">VENDER</span>
            <span class="slogan-mais">Mais!</span>
        </div>
    </div>

    <div class="dashboard">
        <div id="main-card" class="card card-full">
            <span class="label">Meta Mensal (Maio) - R$ 18.000.000</span>
            <span class="label">Vendas Acumuladas</span>
            <div class="value" id="venda-atual">R$ 18.100.000</div>
            <div class="progress-container">
                <div class="progress-bar" id="bar-width" style="width: 0%;">
                    <span class="progress-text" id="perc-text">0%</span>
                </div>
            </div>
        </div>

        <div class="card">
            <span class="label">Vendas Dia 28/05</span>
            <div class="value-secondary">R$ 1.250.000</div>
        </div>

        <div class="card">
            <span class="label">Vendas Dia 29/05</span>
            <div class="value-secondary">R$ 0</div>
        </div>
    </div>

    <div class="footer">
        P360 | KFG Distribuidora | <span id="timer">Próxima atualização em 300s</span>
    </div>

    <script>
        // CONFIGURAÇÕES
        const META = 18000000;
        const VENDA_ATUAL = 18000000; // Altere aqui o valor real
        const RELOAD_TIME = 120; // segundos

        function updateDashboard() {
            const percent = (VENDA_ATUAL / META) * 100;
            const bar = document.getElementById('bar-width');
            const percText = document.getElementById('perc-text');
            const mainCard = document.getElementById('main-card');

            // Atualiza barra e texto
            bar.style.width = (percent > 100 ? 100 : percent) + '%';
            percText.innerText = Math.floor(percent) + '%';

            // Verifica se bateu a meta
            if (percent >= 100) {
                mainCard.classList.add('goal-reached');
                lancarFogos();
            }
        }

        function lancarFogos() {
            var duration = 30 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              // Fogos saindo de posições aleatórias
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // Lógica de Reload e Timer
        let timeLeft = RELOAD_TIME;
        const timerDisplay = document.getElementById('timer');

        setInterval(() => {
            timeLeft--;
            timerDisplay.innerText = `Próxima atualização em ${timeLeft}s`;
            if (timeLeft <= 0) {
                location.reload();
            }
        }, 1000);

        // Inicia a página
        window.onload = updateDashboard;
    </script>
</body>
</html>
