
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="300"> <!-- Auto refresh a cada 5 minutos (300 segundos) -->
    <title>P360 - Convenção de Vendas KFG</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Playfair+Display:ital,wght@1,700&family=Roboto:wght@400;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            padding: 20px;
        }

        .header {
            text-align: center;
            width: 100%;
        }

        .logo {
            max-width: 300px;
            margin-bottom: 10px;
        }

        .slogan-container {
            text-align: center;
            line-height: 1.1;
            margin-top: 10px;
        }

        /* Estilização para simular a imagem enviada */
        .slogan-sim-nos {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 3.5rem;
            color: #fff;
            display: block;
        }

        .slogan-podemos {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: -2px;
            color: #fff;
            background: linear-gradient(to bottom, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
            margin-top: -15px;
        }

        .slogan-vender {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: 8.5rem;
            color: #fff;
            display: block;
            margin-top: -20px;
        }

        .slogan-mais {
            font-family: 'Playfair Display', serif;
            font-size: 9.5rem;
            color: #fff;
            display: block;
            margin-top: -30px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            width: 90%;
            max-width: 1400px;
            margin: 20px 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .card-full {
            grid-column: span 2;
        }

        .label {
            text-transform: uppercase;
            font-size: 1.5rem;
            color: #aaa;
            margin-bottom: 10px;
            display: block;
            letter-spacing: 2px;
        }

        .value {
            font-family: 'Oswald', sans-serif;
            font-size: 5rem;
            font-weight: 700;
            color: #ffd700; /* Dourado para destaque */
        }

        .value-secondary {
            font-family: 'Oswald', sans-serif;
            font-size: 4rem;
            color: #00ff88; /* Verde para vendas do dia */
        }

        .progress-container {
            width: 100%;
            background-color: #333;
            border-radius: 50px;
            height: 40px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff8c00, #ffd700);
            width: 75%; /* Valor de exemplo: R$ 13.5M / R$ 18M */
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15px;
            transition: width 1s ease-in-out;
        }

        .progress-text {
            color: #000;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .footer {
            width: 100%;
            text-align: center;
            padding: 10px;
            border-top: 1px solid #333;
            color: #666;
            font-size: 1.2rem;
        }

        .highlight-meta {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

    </style>
</head>
<body>

    <div class="header">
        <img src="https://raw.githubusercontent.com/fsbarbosa90/kfg-p360/refs/heads/main/02.png" alt="Logo KFG" class="logo">
        <div class="slogan-container">
            <span class="slogan-sim-nos">Sim, Nós</span>
            <span class="slogan-podemos">PODEMOS</span>
            <span class="slogan-vender">VENDER</span>
            <span class="slogan-mais">Mais!</span>
        </div>
    </div>

    <div class="dashboard">
        <!-- Meta Global e Acumulado -->
        <div class="card card-full">
            <span class="label">Meta Mensal (Maio)</span>
            <div class="highlight-meta">R$ 18.000.000,00</div>
            <span class="label">Vendas Acumuladas</span>
            <div class="value">R$ 13.500.000,00</div> <!-- Exemplo: alterar para valor real -->
            <div class="progress-container">
                <div class="progress-bar" style="width: 75%;">
                    <span class="progress-text">75%</span>
                </div>
            </div>
        </div>

        <!-- Vendas Dia 28 -->
        <div class="card">
            <span class="label">Vendas Dia 28/05</span>
            <div class="value-secondary">R$ 1.250.000,00</div> <!-- Valor fictício para o exemplo -->
        </div>

        <!-- Vendas Dia 29 -->
        <div class="card">
            <span class="label">Vendas Dia 29/05</span>
            <div class="value-secondary">R$ 0,00</div> <!-- Valor fictício para o exemplo -->
        </div>
    </div>

    <div class="footer">
        P360 | Convenção de Vendas KFG Distribuidora | Atualização automática a cada 5 min
    </div>

    <script>
        // Aqui você pode adicionar lógica JavaScript para buscar os valores reais de uma API no futuro
        console.log("P360 Dashboard Ativo");
    </script>
</body>
</html>
