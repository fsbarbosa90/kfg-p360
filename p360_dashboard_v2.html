
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="300">
    <title>P360 - Convenção de Vendas KFG</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Playfair+Display:ital,wght@1,700&family=Roboto:wght@400;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Removendo scroll e fixando altura */
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Roboto', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1vh 2vw;
        }

        .header {
            text-align: center;
            flex-shrink: 0;
            margin-bottom: 1vh;
        }

        .logo {
            height: 12vh; /* Altura relativa para não empurrar conteúdo */
            width: auto;
            margin-bottom: 0.5vh;
        }

        .slogan-container {
            line-height: 0.9;
        }

        .slogan-sim-nos {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 2.8vh;
            color: #fff;
            display: block;
        }

        .slogan-podemos {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: 10vh;
            font-weight: 900;
            letter-spacing: -2px;
            color: #fff;
            display: block;
        }

        .slogan-vender {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: 10.5vh;
            color: #fff;
            display: block;
            margin-top: -1vh;
        }

        .slogan-mais {
            font-family: 'Playfair Display', serif;
            font-size: 11vh;
            color: #fff;
            display: block;
            margin-top: -2vh;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2vh;
            width: 100%;
            max-width: 95vw;
            flex-grow: 1; /* Ocupa o espaço restante */
            margin: 1vh 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2vh;
        }

        .card-full {
            grid-column: span 2;
        }

        .label {
            text-transform: uppercase;
            font-size: 1.8vh;
            color: #aaa;
            letter-spacing: 1px;
            margin-bottom: 0.5vh;
        }

        .value {
            font-family: 'Oswald', sans-serif;
            font-size: 10vh;
            line-height: 1;
            font-weight: 700;
            color: #ffd700;
        }

        .value-secondary {
            font-family: 'Oswald', sans-serif;
            font-size: 7vh;
            line-height: 1;
            color: #00ff88;
        }

        .progress-container {
            width: 80%;
            background-color: #333;
            border-radius: 20px;
            height: 3vh;
            margin-top: 1.5vh;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff8c00, #ffd700);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
        }

        .progress-text {
            color: #000;
            font-weight: bold;
            font-size: 1.5vh;
        }

        .footer {
            flex-shrink: 0;
            text-align: center;
            padding: 1vh;
            color: #444;
            font-size: 1.2vh;
            text-transform: uppercase;
        }

        .highlight-meta {
            color: #fff;
            font-size: 2.5vh;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="header">
        <img src="https://raw.githubusercontent.com/fsbarbosa90/kfg-p360/refs/heads/main/02.png" alt="Logo KFG" class="logo">
        <div class="slogan-container">
            <span class="slogan-sim-nos">Sim, Nós</span>
            <span class="slogan-podemos">PODEMOS</span>
            <span class="slogan-vender">VENDER</span>
            <span class="slogan-mais">Mais!</span>
        </div>
    </div>

    <div class="dashboard">
        <div class="card card-full">
            <span class="label">Meta Mensal (Maio) - R$ 18.000.000</span>
            <span class="label">Vendas Acumuladas</span>
            <div class="value">R$ 13.500.000</div>
            <div class="progress-container">
                <div class="progress-bar" style="width: 75%;">
                    <span class="progress-text">100%</span>
                </div>
            </div>
        </div>

        <div class="card">
            <span class="label">Vendas Dia 28/05</span>
            <div class="value-secondary">R$ 1.250.000</div>
        </div>

        <div class="card">
            <span class="label">Vendas Dia 29/05</span>
            <div class="value-secondary">R$ 0</div>
        </div>
    </div>

    <div class="footer">
        P360 | KFG Distribuidora
    </div>

</body>
</html>
